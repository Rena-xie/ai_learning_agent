services:
  app:
    build: .
    image: ai-learning-agent:local
    # 密钥与白名单从 .env 注入，不写入镜像
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: sqlite:////app/data/app.db
      # 容器内 127.0.0.1 指向容器自身；默认经 host-gateway 访问宿主机 RAG。
      # 若 RAG 也在 Compose 网络中，请改成 http://<rag-service>:8001。
      KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 只绑定回环地址，避免无认证服务暴露到局域网/公网
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
