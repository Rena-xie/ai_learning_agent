name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 安装锁定依赖
        run: uv sync --frozen
      - name: 格式检查
        run: uv run ruff format --check .
      - name: 静态检查
        run: uv run ruff check .
      - name: 离线测试（不含真实模型）
        run: uv run pytest -m "not real_model" -q
