[project]
name = "ai-learning-agent"
version = "1.0.0"
description = "本地可运行的 AI 学习助手：基于官方技术文档讲解核心概念并给出可追溯来源"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "openai>=1.54",
    "trafilatura>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_agent"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --basetemp=.pytest-tmp"
markers = [
    "real_model: 需要真实模型 API 的测试（会产生外部请求与费用）",
]

[tool.uv]
default-groups = ["dev"]
